<!DOCTYPE html>
<html>
  <head>
    <title>Chaotic Pedalboard - Ambsynth Grid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <meta charset="utf-8">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1115;
      }

      #ambgrid {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #ambgrid-status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.45);
        font: 20px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        pointer-events: none;
        text-align: center;
        padding: 0 16px;
      }

      #ambgrid-status.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="ambgrid"></canvas>
    <div id="ambgrid-status">Connecting...</div>

    <script src="https://cdn.socket.io/4.4.0/socket.io.min.js"></script>
    <script src="scripts/ambsynthEmbed.js"></script>
    <script src="scripts/ambgrid.js"></script>
  </body>
</html>
