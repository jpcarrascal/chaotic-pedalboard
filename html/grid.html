<!DOCTYPE html>
<html>
  <head>
    <title>Chaotic Pedalboard - Grid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <meta charset="utf-8">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1115;
      }

      #grid {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #grid-status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.45);
        font: 20px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        pointer-events: none;
        text-align: center;
        padding: 0 16px;
      }

      #grid-status.hidden {
        display: none;
      }

      /* Join QR overlay: toggled from the sequencer or with q; click/Esc closes. */
      #qr-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 16, 0.88);
        cursor: pointer;
      }

      #qr-overlay.hidden {
        display: none;
      }

      #qr-overlay img {
        width: 85vmin;
        height: 85vmin;
        box-sizing: border-box;
        padding: 3vmin; /* white quiet zone for reliable scanning */
        background: #ffffff;
        border-radius: 1.5vmin;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="grid"></canvas>
    <div id="grid-status">Connecting...</div>
    <div id="qr-overlay" class="hidden"><img id="qr-image" alt="Scan to join"></div>

    <script src="https://cdn.socket.io/4.4.0/socket.io.min.js"></script>
    <script src="/node_modules/qrcodejs/qrcode.min.js"></script>
    <script src="scripts/ambsynthEmbed.js"></script>
    <script src="scripts/grid.js"></script>
  </body>
</html>
