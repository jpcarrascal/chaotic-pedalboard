<!DOCTYPE html>
<html>
  <head>
    <title>Chaotic Pedalboard - Track Controller</title>
    <link rel="stylesheet" href="css/track.css?v=16">
    <link rel="stylesheet" href="css/color-transitions.css">
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LCC0RPQNKH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LCC0RPQNKH');
    </script>
  </head>
  <body>
    <div id="veil" class="full-screen" style="display:flex">
      <div>
        The session will start in a moment...
      </div>
    </div>

    <div id="initials-form" class="full-screen">
      Enter your initials (3 characters max):
      <form>
        <input type="text" id="initials" name="initials" maxlength="3" autocapitalize="characters" autocomplete="off" placeholder="">
        <input type="submit" value="Submit">
      </form>
    </div>

    <div id="controller" class="full-screen">
      <div id="rotate-me">
        <img src="../images/rotatephone.gif" id="rotate" />
        <br/>
        Please rotate to landscape
      </div>

      <!-- Header with device info -->
      <div id="device-info" class="device-header">
        <div class="device-header-content">
          <img id="device-image" class="device-image" src="" alt="Assigned pedal image" style="display:none;">
          <div class="device-text-content">
            <h2 id="device-name">No Pedal Assigned</h2>
            <p id="slot-countdown">Remaining: --:--</p>
          </div>
        </div>
      </div>

      <div id="queue-message" class="queue-message" style="display:none;"></div>

      <!-- Dynamic controller container -->
      <div id="controller-container">
        <!-- Controllers will be dynamically generated here -->
      </div>

      <!-- Participant initials watermark (pedal view), styled like the ambsynth's -->
      <div id="pedal-initials-anchor" aria-hidden="true">
        <div id="pedal-initials"></div>
      </div>

      <!-- Status display -->
      <div id="status" class="status-bar">
        <span id="connection-status">Connecting...</span>
        <span id="midi-activity"></span>
      </div>
    </div>

    <script src="scripts/NoSleep.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/include.js"></script>
    <script src="scripts/midi.js"></script>
    <script src="scripts/ambsynthEmbed.js"></script>
    <script src="scripts/track.js"></script>

  </body>
</html>
